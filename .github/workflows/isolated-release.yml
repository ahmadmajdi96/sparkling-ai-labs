name: Build, check and release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['dev-*', 'staging-*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p build-image && cp -r dist build-image/dist && cp deploy/Dockerfile deploy/Caddyfile build-image/
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: runtime-image
          path: build-image
          include-hidden-files: true
          retention-days: 1
  release:
    name: Publish environment release
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-image
          path: build-image
      - id: target
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) echo 'environment=production' >> "$GITHUB_OUTPUT" ;;
            refs/tags/dev-*) echo 'environment=dev' >> "$GITHUB_OUTPUT" ;;
            refs/tags/staging-*) echo 'environment=staging' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: build-image
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ahmadmajdi96/cortanexai:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Verify anonymous image pull
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          token=$(curl -fsSL 'https://ghcr.io/token?scope=repository:ahmadmajdi96/cortanexai:pull&service=ghcr.io' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsSL --head -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/ahmadmajdi96/cortanexai/manifests/$DIGEST" >/dev/null
      - name: Publish selected environment only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_ENV: ${{ steps.target.outputs.environment }}
          RELEASE_IMAGE: ghcr.io/ahmadmajdi96/cortanexai@${{ steps.image.outputs.digest }}
        run: python3 deploy/publish-release.py
