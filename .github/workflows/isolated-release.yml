name: Build and publish isolated-cluster release
on:
  push:
    branches: [main]
    paths-ignore: [deploy/release.json]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: isolated-release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p build-image && cp -r dist build-image/dist && cp deploy/Dockerfile deploy/Caddyfile build-image/
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: build-image
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ahmadmajdi96/cortanexai:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Verify anonymous image pull before changing deployments
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          token=$(curl -fsSL 'https://ghcr.io/token?scope=repository:ahmadmajdi96/cortanexai:pull&service=ghcr.io' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsSL --head -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/ahmadmajdi96/cortanexai/manifests/$DIGEST" >/dev/null
      - name: Publish the immutable release for private controllers
        env:
          RELEASE_IMAGE: ghcr.io/ahmadmajdi96/cortanexai@${{ steps.image.outputs.digest }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          pathlib.Path('deploy/release.json').write_text(json.dumps({'image':os.environ['RELEASE_IMAGE'],'commit':os.environ['RELEASE_COMMIT']},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/release.json
          git commit -m 'Publish verified immutable deployment release' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
